# Render Blueprint — deploys the StudentOS AI backend as a Docker web service.
#
# In the Render dashboard: New + → Blueprint → connect this repo. Render reads
# this file and creates the service; you then fill in the values marked
# "sync: false" (they are never stored in git).
#
# The free plan supports Docker and WebSockets, so Socket.io group chat works.
# Free services sleep after ~15 minutes idle and cold-start in ~50s.

services:
  - type: web
    name: studentos-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # Repo root — the Dockerfile copies the root package.json and lockfile, so
    # the build context must be the whole repo, not backend/.
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health/ready
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"

      # Cross-domain cookies: a Vercel frontend and Render API are on different
      # sites, so the refresh cookie must be SameSite=None with no fixed domain.
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_DOMAIN
        value: ""

      # Render generates strong values once and keeps them across deploys, so
      # sessions survive redeploys. You never need to see these.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # --- Fill these in the dashboard (sync:false = prompted, not in git) ---
      - key: DATABASE_URL          # Supabase pooler URL, with % encoded as %25
        sync: false
      - key: APP_URL               # your Vercel URL, e.g. https://student-os.vercel.app
        sync: false
      - key: API_URL               # this service's own Render URL
        sync: false

      # Optional integrations — leave unset to run without them.
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
