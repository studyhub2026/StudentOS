<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="omnel-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="omnel-dots" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- The main O — a thick ring with a soft blue-to-purple sweep -->
  <circle
    cx="118"
    cy="100"
    r="60"
    stroke="url(#omnel-ring)"
    stroke-width="20"
    fill="none"
  />

  <!-- Dot trails on the left, echoing the "flow into the O" motif -->
  <g fill="url(#omnel-dots)">
    <circle cx="26" cy="100" r="4" opacity="0.35" />
    <circle cx="40" cy="100" r="5" opacity="0.55" />
    <circle cx="56" cy="100" r="6" opacity="0.75" />

    <circle cx="30" cy="80" r="3.5" opacity="0.35" />
    <circle cx="44" cy="80" r="4.5" opacity="0.55" />
    <circle cx="58" cy="80" r="5.5" opacity="0.7" />

    <circle cx="30" cy="120" r="3.5" opacity="0.35" />
    <circle cx="44" cy="120" r="4.5" opacity="0.55" />
    <circle cx="58" cy="120" r="5.5" opacity="0.7" />
  </g>

  <!-- Dash trails connecting the dots into the ring -->
  <g stroke="url(#omnel-dots)" stroke-linecap="round" stroke-width="4" fill="none">
    <line x1="70" y1="100" x2="90" y2="100" opacity="0.8" />
    <line x1="70" y1="80" x2="88" y2="80" opacity="0.65" />
    <line x1="70" y1="120" x2="88" y2="120" opacity="0.65" />
  </g>
</svg>
