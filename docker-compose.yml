# Local stack for the unified Next.js app: Postgres plus the web app.
#
#   docker compose up -d postgres     # database only (run `npm run dev` on the host)
#   docker compose up --build         # the whole stack
#
# The app is a single Next.js service — its API routes and Prisma client run in
# the same process, so there is no separate backend and no Redis. Apply the
# schema with `npm run prisma:push` (pointed at DATABASE_URL) before first use.
#
# Secrets come from a .env file beside this one; nothing is hardcoded.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studentos}
      POSTGRES_DB: ${POSTGRES_DB:-studentos}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Dependent services must wait for readiness, not merely for the
      # container to start — Postgres accepts connections well after boot.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-studentos} -d ${POSTGRES_DB:-studentos}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-studentos}:${POSTGRES_PASSWORD:-studentos}@postgres:5432/${POSTGRES_DB:-studentos}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      # Optional integrations — leave unset to run without them.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  postgres-data:
