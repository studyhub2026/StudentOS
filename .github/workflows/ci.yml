name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    env:
      # Deterministic, non-secret values — the unit tests stub the database and
      # `next build` only needs the env to pass validation, never to connect.
      DATABASE_URL: postgresql://studentos:studentos@localhost:5432/studentos_test
      JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-for-validation
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-for-validation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Fails the job on high or critical advisories only; moderate findings
      # are reported without blocking every pull request.
      - run: npm audit --audit-level=high

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
